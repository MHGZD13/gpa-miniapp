<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دانیار | Danyar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #020108;
  --bg-glass-heavy: rgba(22, 22, 30, 0.7);
  --bg-glass-medium: rgba(35, 35, 48, 0.5);
  --bg-glass-light: rgba(55, 55, 75, 0.4);
  --label-primary: #FFFFFF;
  --label-secondary: rgba(235, 235, 245, 0.6);
  --separator: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.12);
  --ios-blue: #0A84FF;
  --ios-green: #30D158;
  --ios-orange: #FF9F0A;
  --ios-red: #FF453A;
  --ios-purple: #BF5AF2;
  --safe-top: env(safe-area-inset-top, 20px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%; overflow: hidden;
  background: radial-gradient(circle at 50% 0%, #150a21 0%, #050510 70%, #000000 100%);
  color: var(--label-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Vazirmatn', sans-serif;
}
button, input, textarea { font-family: inherit; outline: none; border: none; }
button { cursor: pointer; }

#bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.app-container { display: flex; flex-direction: column; height: 100dvh; position: relative; z-index: 1; }

.header-bar {
  padding: calc(var(--safe-top) + 10px) 20px 12px;
  background: rgba(12, 12, 18, 0.5);
  backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border-bottom: 0.5px solid var(--separator);
  display: flex; justify-content: space-between; align-items: center;
  position: relative; z-index: 10;
}
.header-title { font-size: 24px; font-weight: 800; }
.header-action { color: var(--ios-blue); font-size: 15px; font-weight: 600; background: none; }

.pages-wrapper { flex: 1; position: relative; overflow: hidden; }
.page {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(var(--safe-bottom) + 85px);
  display: none; flex-direction: column; gap: 16px;
  animation: pageFade 0.25s ease;
}
.page.active { display: flex; }
@keyframes pageFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Tab Bar */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15, 15, 22, 0.65);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-top: 0.5px solid var(--separator);
  display: flex; justify-content: space-around;
  padding: 10px 10px calc(var(--safe-bottom) + 6px);
  z-index: 100;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--label-secondary); background: none; width: 60px;
}
.tab-item.active { color: var(--ios-blue); }
.tab-icon { font-size: 20px; transition: transform 0.2s; }
.tab-item.active .tab-icon { transform: scale(1.15); }
.tab-label { font-size: 10.5px; font-weight: 600; }

/* عناصر UI */
.ios-card {
  background: var(--bg-glass-heavy);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 0.5px solid var(--glass-border);
  border-radius: 20px; padding: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.segmented-control {
  background: var(--bg-glass-medium);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 0.5px solid var(--glass-border);
  border-radius: 12px; padding: 3px;
  display: flex; width: 100%;
}
.seg-btn {
  flex: 1; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--label-primary);
  background: transparent; border-radius: 9px; transition: all 0.2s;
}
.seg-btn.active { background: rgba(255,255,255,0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }

.ios-btn-primary {
  background: var(--ios-blue); color: #fff; border-radius: 14px; padding: 12px;
  font-size: 14.5px; font-weight: 700; width: 100%; text-align: center;
}
.ios-btn-primary:active { opacity: 0.8; }
.ios-input {
  background: var(--bg-glass-light); border: 0.5px solid var(--glass-border);
  border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; width: 100%;
}

/* ═════════ استایل دقیق پوستر ماتریسی برنامه هفتگی (مطابق عکس) ═════════ */
.poster-container {
  background: #edf2f9;
  border-radius: 24px;
  padding: 24px 16px;
  color: #1e293b;
  overflow-x: auto;
  box-shadow: 0 12px 35px rgba(0,0,0,0.4);
}
.poster-header {
  text-align: center;
  margin-bottom: 20px;
}
.poster-header h2 {
  font-size: 26px;
  font-weight: 900;
  color: #0f172a;
  letter-spacing: -0.5px;
}
.poster-header p {
  font-size: 12.5px;
  color: #64748b;
  font-weight: 600;
  margin-top: 3px;
}
.poster-grid-table {
  display: grid;
  grid-template-columns: 85px repeat(5, minmax(130px, 1fr));
  gap: 12px;
  min-width: 740px;
  direction: rtl;
}

/* هدر روزها با لبه‌های کپسولی */
.day-head-cell {
  height: 44px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14.5px;
  font-weight: 800;
  border: 1.5px solid transparent;
}
.day-head-cell.sat { background: #f8fafc; border-color: #cbd5e1; color: #475569; }
.day-head-cell.sun { background: #fefce8; border-color: #facc15; color: #854d0e; }
.day-head-cell.mon { background: #f0f9ff; border-color: #38bdf8; color: #0369a1; }
.day-head-cell.tue { background: #f0fdf4; border-color: #4ade80; color: #166534; }
.day-head-cell.wed { background: #faf5ff; border-color: #c084fc; color: #6b21a8; }

/* سلول زمان سمت چپ */
.time-col-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 700;
  color: #64748b;
  direction: ltr;
  height: 92px;
}

/* کادر دروس */
.slot-cell {
  height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.class-box {
  width: 100%;
  height: 100%;
  background: #ffffff;
  border: 1.5px solid #e2e8f0;
  border-radius: 18px;
  padding: 6px 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  box-shadow: 0 3px 6px rgba(0,0,0,0.03);
}
.class-box.box-sun { border-color: #fde047; }
.class-box.box-mon { border-color: #7dd3fc; }
.class-box.box-tue { border-color: #86efac; }
.class-box.box-wed { border-color: #d8b4fe; }
.class-box.box-sat { border-color: #cbd5e1; }

.class-box .title {
  font-size: 12.5px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1.35;
}
.class-box .loc {
  font-size: 11px;
  color: #64748b;
  margin-top: 3px;
  font-weight: 600;
}
.class-box .badge-pink {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: #fdf2f8;
  border: 1.5px solid #f472b6;
  color: #db2777;
  padding: 3px 7px;
  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 800;
}
.class-box .del-btn {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(239, 68, 68, 0.12);
  color: #ef4444;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* سایر استایل‌های لیست و معدل */
.ios-list { background: var(--bg-glass-heavy); border: 0.5px solid var(--glass-border); border-radius: 16px; overflow: hidden; }
.ios-list-item { padding: 12px 16px; border-bottom: 0.5px solid var(--separator); display: flex; justify-content: space-between; align-items: center; }
.task-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--separator); }
.task-row.done .item-title { text-decoration: line-through; color: var(--label-secondary); }
.check-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--label-secondary); display: flex; align-items: center; justify-content: center; }
.task-row.done .check-circle { background: var(--ios-blue); border-color: var(--ios-blue); }
.task-row.done .check-circle::after { content: '✓'; color: #fff; font-size: 13px; }
.gpa-content-section { display: none; flex-direction: column; gap: 14px; }
.gpa-content-section.active { display: flex; }
.toast {
  position: fixed; top: calc(var(--safe-top) + 16px); left: 50%; transform: translate(-50%, -50px);
  background: #fff; color: #000; padding: 10px 20px; border-radius: 25px;
  font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.3s; z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal-box { background: var(--bg-glass-heavy); border-radius: 20px; width: 88%; padding: 20px; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app-container">
  <div class="header-bar">
    <div class="header-title" id="pageTitle">دانیار</div>
    <button class="header-action" id="headerAction" style="display:none;"></button>
  </div>

  <div class="pages-wrapper">
    <!-- 🏠 خانه -->
    <div class="page active" id="pg-home">
      <div>
        <div style="font-size:13px; color:var(--label-secondary);">خوش آمدید،</div>
        <div style="font-size:26px; font-weight:800;" id="userName">مهدی قربان‌زاده</div>
      </div>
      <div class="ios-card" onclick="switchTab('schedule')">
        <div style="display:flex; justify-content:space-between;">
          <div style="font-size:18px;">🗓️</div>
          <div style="font-size:12px; color:var(--ios-blue); font-weight:700;" id="todayName">امروز</div>
        </div>
        <div style="font-size:28px; font-weight:800; margin-top:8px;" id="todayCount">۰</div>
        <div style="font-size:12px; color:var(--label-secondary);">کلاس برای امروز</div>
      </div>
      <div style="display:flex; gap:12px;">
        <div class="ios-card" style="flex:1" onclick="switchTab('tasks')">
          <div style="font-size:18px;">✅</div>
          <div style="font-size:24px; font-weight:800; margin-top:8px;" id="pendingTasks">۰</div>
          <div style="font-size:12px; color:var(--label-secondary);">تکلیف باز</div>
        </div>
        <div class="ios-card" style="flex:1" onclick="switchTab('pomo')">
          <div style="font-size:18px;">⏱️</div>
          <div style="font-size:24px; font-weight:800; margin-top:8px;">۲۵</div>
          <div style="font-size:12px; color:var(--label-secondary);">پومودورو</div>
        </div>
      </div>
    </div>

    <!-- 🗓️ برنامه هفتگی -->
    <div class="page" id="pg-schedule">
      <div class="segmented-control">
        <button class="seg-btn active" id="btn-wf-all" onclick="setWeekFilter('all')">همه</button>
        <button class="seg-btn" id="btn-wf-odd" onclick="setWeekFilter('odd')">فرد</button>
        <button class="seg-btn" id="btn-wf-even" onclick="setWeekFilter('even')">زوج</button>
      </div>

      <button class="ios-btn-primary" onclick="downloadSchedulePng()">
        📸 دانلود پوستر برنامه هفتگی (PNG)
      </button>

      <!-- کانتینر رندر پوستر -->
      <div id="scheduleContainer"></div>
    </div>

    <!-- ✅ تکالیف -->
    <div class="page" id="pg-tasks">
      <div style="display:flex; gap:8px;">
        <input type="text" id="taskInput" class="ios-input" placeholder="یادآوری یا تکلیف جدید...">
        <button class="ios-btn-primary" style="width:54px;" onclick="addTask()">+</button>
      </div>
      <div class="ios-list" id="taskListContainer"></div>
    </div>

    <!-- 📊 معدل -->
    <div class="page" id="pg-gpa">
      <div class="segmented-control">
        <button class="seg-btn active" id="gtab-input" onclick="switchGpaTab('input')">ورودی</button>
        <button class="seg-btn" id="gtab-result" onclick="switchGpaTab('result')">نتیجه</button>
        <button class="seg-btn" id="gtab-history" onclick="switchGpaTab('history')">تاریخچه</button>
      </div>

      <div id="gpat-input" class="gpa-content-section active">
        <div class="ios-list" id="coursesList"></div>
        <button class="ios-btn-primary" style="background:var(--bg-glass-medium); color:var(--ios-blue);" onclick="addGpaRow()">+ افزودن درس</button>
        <button class="ios-btn-primary" onclick="calcGpa()">محاسبه معدل</button>
      </div>

      <div id="gpat-result" class="gpa-content-section">
        <div class="ios-card" style="text-align:center;">
          <div style="font-size:36px; font-weight:900;" id="gpaVal">—</div>
          <div style="font-size:12px; color:var(--label-secondary); margin-top:4px;">معدل این ترم</div>
        </div>
        <button class="ios-btn-primary" onclick="saveTerm()">💾 ذخیره ترم</button>
      </div>

      <div id="gpat-history" class="gpa-content-section">
        <div class="ios-card" style="text-align:center;">
          <div style="font-size:13px; color:var(--label-secondary);">معدل کل</div>
          <div id="overallGpa" style="font-size:36px; font-weight:900; color:var(--ios-blue);">—</div>
        </div>
        <div id="termsList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>

    <!-- ⏱️ پومودورو -->
    <div class="page" id="pg-pomo">
      <div style="display:flex; justify-content:center; padding:50px 0;">
        <div style="font-size:74px; font-weight:200;" id="pomoDisplay">25:00</div>
      </div>
      <div style="display:flex; gap:12px;">
        <button class="ios-btn-primary" style="background:var(--bg-glass-medium); flex:1;" onclick="resetPomo()">بازنشانی</button>
        <button class="ios-btn-primary" style="background:var(--ios-green); flex:2;" id="pomoPlayBtn" onclick="togglePomo()">شروع</button>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-item active" id="tab-home" onclick="switchTab('home')"><span class="tab-icon">🏠</span><span class="tab-label">خانه</span></button>
    <button class="tab-item" id="tab-schedule" onclick="switchTab('schedule')"><span class="tab-icon">🗓️</span><span class="tab-label">برنامه</span></button>
    <button class="tab-item" id="tab-tasks" onclick="switchTab('tasks')"><span class="tab-icon">✅</span><span class="tab-label">تکالیف</span></button>
    <button class="tab-item" id="tab-gpa" onclick="switchTab('gpa')"><span class="tab-icon">📊</span><span class="tab-label">معدل</span></button>
  </div>
</div>

<div class="modal-overlay" id="importModal">
  <div class="modal-box">
    <div style="font-size:16px; font-weight:700; margin-bottom:12px; text-align:center;">کد برنامه ربات را وارد کنید</div>
    <textarea id="jsonInput" class="ios-input" style="height:100px; direction:ltr; font-family:monospace; margin-bottom:12px;"></textarea>
    <div style="display:flex; gap:8px;">
      <button class="ios-btn-primary" style="background:rgba(255,255,255,0.1);" onclick="closeModal('importModal')">لغو</button>
      <button class="ios-btn-primary" onclick="processImport()">ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Canvas انیمیشن
(function(){
  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
  let stars = Array.from({length: 60}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5 + 0.2 }));
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });
  draw();
})();

const tg = window.Telegram?.WebApp;
if(tg) { tg.ready(); tg.expand(); }
function triggerHaptic(s = 'light') { try { tg?.HapticFeedback?.impactOccurred(s); } catch(e){} }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function safeGet(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch(e){ return def; } }
function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

const pageTitles = { home: 'دانیار', schedule: 'برنامه کلاسی', tasks: 'تکالیف', gpa: 'معدل', pomo: 'پومودورو' };

function switchTab(id) {
  triggerHaptic();
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${id>='pomo'?'home':id}`)?.classList.add('active');
  document.getElementById('pageTitle').textContent = pageTitles[id] || 'دانیار';
  
  const actionBtn = document.getElementById('headerAction');
  actionBtn.style.display = 'none';
  if (id === 'schedule') {
    actionBtn.style.display = 'block'; actionBtn.textContent = 'وارد کردن'; actionBtn.onclick = () => openModal('importModal');
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('pg-' + id).classList.add('active');
  
  if(id === 'home') updateHome();
  if(id === 'schedule') renderSchedule();
  if(id === 'tasks') renderTasks();
}

function openModal(id) { triggerHaptic(); document.getElementById(id).classList.add('show'); }
function closeModal(id) { triggerHaptic(); document.getElementById(id).classList.remove('show'); }

// ۱. خانه
function updateHome() {
  document.getElementById('userName').textContent = safeGet('danyar_name', 'مهدی قربان‌زاده');
  const DAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  const todayName = DAYS[new Date().getDay()];
  document.getElementById('todayName').textContent = todayName;
  const sched = safeGet('danyar_schedule', {});
  document.getElementById('todayCount').textContent = (sched[todayName] || []).length;
  document.getElementById('pendingTasks').textContent = safeGet('danyar_tasks', []).filter(t => !t.done).length;
}

// ۲. برنامه کلاسی ماتریسی (دقیقاً مشابه تصویر)
let weekFilter = 'all';

const TIME_SLOTS = [
  { label: '۰۸:۰۰ - ۱۰:۰۰', h: 8 },
  { label: '۱۰:۰۰ - ۱۲:۰۰', h: 10 },
  { label: '۱۳:۰۰ - ۱۵:۰۰', h: 13 },
  { label: '۱۵:۰۰ - ۱۷:۰۰', h: 15 },
  { label: '۱۷:۰۰ - ۱۹:۰۰', h: 17 }
];

const DISPLAY_DAYS = [
  { key: 'شنبه', label: 'شنبه', cls: 'sat' },
  { key: 'یکشنبه', label: 'یکشنبه', cls: 'sun' },
  { key: 'دوشنبه', label: 'دوشنبه', cls: 'mon' },
  { key: 'سه‌شنبه', label: 'سه‌شنبه', cls: 'tue' },
  { key: 'چهارشنبه', label: 'چهارشنبه', cls: 'wed' }
];

function setWeekFilter(type) {
  triggerHaptic(); weekFilter = type;
  document.querySelectorAll('#pg-schedule .seg-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-wf-${type}`).classList.add('active');
  renderSchedule();
}

function deleteClass(day, index) {
  triggerHaptic('medium');
  if(confirm("آیا از حذف این کلاس اطمینان دارید؟")) {
    const sched = safeGet('danyar_schedule', {});
    if(sched[day] && sched[day][index] !== undefined) {
      sched[day].splice(index, 1);
      safeSet('danyar_schedule', sched);
      showToast('کلاس حذف شد');
      renderSchedule();
      updateHome();
    }
  }
}

function renderSchedule() {
  const sched = safeGet('danyar_schedule', {});
  const container = document.getElementById('scheduleContainer');
  const stuName = safeGet('danyar_name', 'مهدی قربان‌زاده');

  let html = `
    <div class="poster-container" id="posterArea">
      <div class="poster-header">
        <h2>برنامه هفتگی</h2>
        <p>${stuName} • مهندسی شیمی • ترم جاری</p>
      </div>

      <div class="poster-grid-table">
        <div style="height:44px;"></div>
  `;

  // رندر هدر روزها
  DISPLAY_DAYS.forEach(d => {
    html += `<div class="day-head-cell ${d.cls}">${d.label}</div>`;
  });

  // رندر سطرها و کارت‌ها
  TIME_SLOTS.forEach(slot => {
    html += `<div class="time-col-cell">${slot.label}</div>`;

    DISPLAY_DAYS.forEach(d => {
      const dayClasses = sched[d.key] || [];
      // جستجوی کلاسی که ساعت شروعش در بازه این ۲ ساعت قرار دارد
      const matched = dayClasses
        .map((c, originalIndex) => ({ ...c, originalIndex }))
        .filter(c => {
          if (!c.start) return false;
          const classH = parseInt(c.start.split(':')[0], 10);
          return classH >= slot.h && classH < (slot.h + 2);
        })
        .filter(c => weekFilter === 'all' || !c.week || c.week === 'all' || c.week === weekFilter);

      html += `<div class="slot-cell">`;
      if (matched.length > 0) {
        const c = matched[0];
        const isOdd = c.week === 'odd';
        const isEven = c.week === 'even';
        const badge = isOdd ? `<span class="badge-pink">فرد</span>` : isEven ? `<span class="badge-pink">زوج</span>` : '';

        html += `
          <div class="class-box box-${d.cls}">
            <button class="del-btn" onclick="deleteClass('${d.key}', ${c.originalIndex})">✕</button>
            ${badge}
            <div class="title" style="${(isOdd||isEven)?'margin-right:24px;':''}">${c.name}</div>
            <div class="loc">${c.location || 'کلاس'}</div>
          </div>
        `;
      }
      html += `</div>`;
    });
  });

  html += `
      </div>
      <div style="margin-top:16px; text-align:center; font-size:11px; color:#94a3b8; font-weight:600;">
        دانیار • برنامه هفتگی هوشمند • صورتی = فرد/زوج
      </div>
    </div>
  `;

  container.innerHTML = html;
}

function downloadSchedulePng() {
  triggerHaptic('medium');
  const target = document.getElementById('posterArea');
  if(!target) return;

  showToast('در حال ایجاد فایل باکیفیت PNG...');

  html2canvas(target, {
    backgroundColor: '#edf2f9',
    scale: 3,
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `برنامه_هفتگی_${safeGet('danyar_name', 'دانشجو')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ عکس برنامه ذخیره شد');
  }).catch(() => {
    showToast('خطا در تبدیل عکس');
  });
}

function processImport() {
  try {
    const data = JSON.parse(document.getElementById('jsonInput').value.trim());
    if(data.schedule) {
      safeSet('danyar_schedule', data.schedule);
      if(data.student_name) safeSet('danyar_name', data.student_name);
      showToast('برنامه ذخیره شد');
      closeModal('importModal'); renderSchedule(); updateHome();
    }
  } catch(e) { showToast('کد نامعتبر است'); }
}

// تکالیف
function renderTasks() {
  const tasks = safeGet('danyar_tasks', []);
  const c = document.getElementById('taskListContainer');
  c.innerHTML = tasks.map((t, i) => `
    <div class="task-row ${t.done ? 'done' : ''}" onclick="toggleTask(${i})">
      <div class="check-circle"></div><div class="item-title">${t.text}</div>
      <button style="color:var(--ios-red); background:none; margin-right:auto;" onclick="event.stopPropagation(); delTask(${i})">✕</button>
    </div>`).join('');
}
function addTask() {
  const inp = document.getElementById('taskInput');
  if(!inp.value.trim()) return;
  const t = safeGet('danyar_tasks', []);
  t.unshift({text: inp.value.trim(), done:false});
  safeSet('danyar_tasks', t);
  inp.value = ''; renderTasks();
}
function toggleTask(i) { const t = safeGet('danyar_tasks', []); t[i].done = !t[i].done; safeSet('danyar_tasks', t); renderTasks(); }
function delTask(i) { const t = safeGet('danyar_tasks', []); t.splice(i,1); safeSet('danyar_tasks', t); renderTasks(); }

// معدل
function switchGpaTab(tab) {
  document.querySelectorAll('#pg-gpa .seg-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`gtab-${tab}`).classList.add('active');
  document.querySelectorAll('.gpa-content-section').forEach(s => s.classList.remove('active'));
  document.getElementById(`gpat-${tab}`).classList.add('active');
}
function addGpaRow(n='', u='', g='') {
  const div = document.createElement('div');
  div.className = 'ios-list-item gpa-row';
  div.innerHTML = `
    <input type="text" class="ios-input gpa-name" placeholder="نام درس" value="${n}" style="width:40%;">
    <input type="number" class="ios-input gpa-unit" placeholder="واحد" value="${u}" style="width:20%; text-align:center;">
    <input type="number" class="ios-input gpa-score" placeholder="نمره" value="${g}" style="width:20%; text-align:center;">
    <button style="color:var(--ios-red); background:none;" onclick="this.parentElement.remove()">✕</button>
  `;
  document.getElementById('coursesList').appendChild(div);
}
let currentGpaVal = 0;
function calcGpa() {
  const rows = document.querySelectorAll('.gpa-row');
  let units = 0, points = 0;
  rows.forEach(r => {
    const u = parseFloat(r.querySelector('.gpa-unit').value);
    const g = parseFloat(r.querySelector('.gpa-score').value);
    if(!isNaN(u) && !isNaN(g)) { units += u; points += u * g; }
  });
  if(!units) return showToast('واحد و نمره را وارد کنید');
  currentGpaVal = (points / units).toFixed(2);
  document.getElementById('gpaVal').textContent = currentGpaVal;
  switchGpaTab('result');
}
function saveTerm() {
  if(!currentGpaVal) return;
  const terms = safeGet('danyar_terms', []);
  terms.push({ gpa: currentGpaVal });
  safeSet('danyar_terms', terms);
  showToast('ترم ذخیره شد');
}

// پومودورو
let pomoTime = 25*60, pInt = null;
function togglePomo() {
  const b = document.getElementById('pomoPlayBtn');
  if(pInt) { clearInterval(pInt); pInt = null; b.textContent = 'ادامه'; }
  else {
    b.textContent = 'توقف';
    pInt = setInterval(() => {
      pomoTime--;
      const m = Math.floor(pomoTime/60).toString().padStart(2,'0');
      const s = (pomoTime%60).toString().padStart(2,'0');
      document.getElementById('pomoDisplay').textContent = `${m}:${s}`;
      if(pomoTime<=0){ clearInterval(pInt); pInt = null; resetPomo(); }
    }, 1000);
  }
}
function resetPomo() { clearInterval(pInt); pInt = null; pomoTime = 25*60; document.getElementById('pomoDisplay').textContent = '25:00'; document.getElementById('pomoPlayBtn').textContent = 'شروع'; }

window.addEventListener('DOMContentLoaded', () => { updateHome(); renderSchedule(); addGpaRow(); addGpaRow(); });
</script>
